<head>

<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5b6570;--line:#dfe3e8;--accent:#0f766e;--accent2:#b45309;--soft:#e6f4f2;--c3:#2563eb;--c4:#9333ea;--bad:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101418;--card:#181d23;--text:#e8ebef;--muted:#9aa5b1;--line:#2a323b;--accent:#2dd4bf;--accent2:#fbbf24;--soft:#12302d;--c3:#60a5fa;--c4:#c084fc;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101418;--card:#181d23;--text:#e8ebef;--muted:#9aa5b1;--line:#2a323b;--accent:#2dd4bf;--accent2:#fbbf24;--soft:#12302d;--c3:#60a5fa;--c4:#c084fc;--bad:#f87171;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.home{font-size:.85rem;color:var(--muted);text-decoration:none}
.home:hover{color:var(--accent)}
.lang{display:flex;justify-content:flex-end;gap:6px;font-size:.85rem;flex-wrap:wrap}
.lang a,.lang span{padding:4px 10px;border:1px solid var(--line);border-radius:999px;text-decoration:none;color:var(--muted);background:var(--card)}
.lang span{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
.lang a:hover{border-color:var(--accent);color:var(--text)}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px}
.sub a{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:1.05rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.field .lbl{font-size:.85rem;font-weight:600}
.field small{color:var(--muted);font-size:.75rem}
input,select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.combo{display:grid;grid-template-columns:1fr auto;gap:8px}
.combo select{width:auto;max-width:11rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg{display:grid;gap:8px}
.seg button,.chips button{font:inherit;font-size:.92rem;font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips button{padding:6px 12px;font-size:.85rem;border-radius:999px}
.btn{font:inherit;font-size:.85rem;font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.btn.sm{padding:4px 10px;font-size:.78rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.results{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--soft);border-radius:12px;padding:12px 14px;min-width:0}
.stat span{display:block;font-size:.78rem;color:var(--muted)}
.stat b{display:block;font-size:1.25rem;overflow-wrap:anywhere}
.stat em{display:block;font-style:normal;font-size:.78rem;color:var(--muted)}
.stat.main{grid-column:1/-1}
.stat.main b{font-size:1.8rem;color:var(--accent)}
.summary{background:var(--soft);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.82rem;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg{width:100%;height:auto;display:block}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:440px;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:.78rem;position:sticky;top:0;background:var(--card)}
tr.hl td{background:var(--soft);font-weight:700}
.msg{color:var(--accent2);font-size:.9rem;margin:12px 0 0}
.msg:empty{display:none}
.note{color:var(--muted);font-size:.78rem;margin-top:10px}
.how p{margin:0 0 12px}
.how h3{font-size:.98rem;margin:18px 0 8px}
.how ol,.how ul{margin:0 0 14px;padding-left:20px}
.how li{margin-bottom:6px}
.formula{background:var(--soft);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86rem;overflow-x:auto;line-height:1.7}
.tip{background:var(--soft);border-radius:12px;padding:12px 14px;margin:0 0 14px}
.ex{border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px;background:var(--bg)}
.ex ol{margin-bottom:0}
.faq h3{font-size:.95rem;margin:14px 0 4px}
.faq p{margin:0 0 10px;color:var(--text)}
.ad{margin:0 0 16px;min-height:90px;display:flex;align-items:center;justify-content:center}
.ad:empty{display:none}
.mod{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.mod h3{font-size:.95rem;margin:0 0 10px}
.inl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-weight:600}
.inl input{width:8.5rem}
.out{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px;flex-wrap:wrap}
.out b{font-size:1.3rem;color:var(--accent);overflow-wrap:anywhere}
.out small{display:block;color:var(--muted);font-size:.8rem;width:100%}
footer{border-top:1px solid var(--line);margin-top:24px;padding-top:14px;color:var(--muted);font-size:.8rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer a{color:var(--muted)}
@media (max-width:560px){.grid{grid-template-columns:1fr}.results{grid-template-columns:1fr}.stat.main b{font-size:1.55rem}.seg button{font-size:.85rem}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
a.tile{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--text)}
a.tile:hover{border-color:var(--accent)}
a.tile b{display:block;font-size:.98rem;margin-bottom:4px}
a.tile span{display:block;font-size:.82rem;color:var(--muted)}
h2.cat{font-size:1.1rem;margin:26px 0 12px}
</style>
</head>
